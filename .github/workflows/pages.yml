name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'themes/**'
      - 'data/**'
      - 'src/**'
      - 'install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The site is generated from themes/jet-fighter.json, so a stale theme
      # would publish a page that disagrees with what people install.
      - name: Theme matches source
        run: npm run check:build

      - name: Build site
        run: npm run site:build

      # enablement lets the workflow turn Pages on itself the first time it
      # runs, via the Pages API, using the `pages: write` permission granted
      # above. Without it the first run fails with "Get Pages site failed …
      # Not Found" and the repository has to be configured by hand in
      # Settings before the site can ever deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
